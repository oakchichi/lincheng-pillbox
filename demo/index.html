<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>林澄药盒 v0.1</title>
<style>
:root{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7f9;color:#24333d}
*{box-sizing:border-box}
body{margin:0;padding:24px}
main{max-width:900px;margin:auto}
h1{font-size:28px;margin:0 0 8px}
.sub{color:#657783;margin-bottom:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
button.pill{border:1px solid #b8cad9;background:#e5edf3;color:#405b6d;border-radius:16px;padding:14px 16px;text-align:left;cursor:pointer}
button.pill:hover{filter:brightness(.985)}
.code{font-size:12px;opacity:.65}.name{font-size:18px;font-weight:700;margin:4px 0}.use{font-size:13px;line-height:1.5}
.panel{margin-top:20px;background:white;border:1px solid #d6e0e6;border-radius:18px;padding:20px;display:none}
.panel.show{display:block}
pre{white-space:pre-wrap;font:inherit;line-height:1.7;margin:14px 0}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions button{border:0;border-radius:10px;padding:10px 14px;cursor:pointer}
.copy{background:#516a7a;color:white}.close{background:#edf2f5;color:#40515b}
small{color:#72838e}
</style>
</head>
<body>
<main>
<h1>林澄药盒 · v0.1</h1>
<div class="sub">手动挑一颗，只给下一次回复看。当前页面只是预览与复制工具。</div>
<div id="grid" class="grid"></div>
<section id="panel" class="panel">
<div id="title"></div>
<pre id="text"></pre>
<div class="actions">
<button class="copy" id="copy">复制药方</button>
<button class="close" id="close">收起</button>
</div>
</section>
<p><small>提示：GitHub Pages / 本地静态服务器中使用。直接 file:// 打开时浏览器可能阻止读取 JSON。</small></p>
</main>
<script>
(async()=>{
  const data=await fetch('../pills/pills.json').then(r=>r.json());
  const grid=document.querySelector('#grid'), panel=document.querySelector('#panel');
  const title=document.querySelector('#title'), text=document.querySelector('#text');
  let current='';
  data.items.forEach(p=>{
    const b=document.createElement('button'); b.className='pill';
    b.innerHTML='<div class="code">'+p.code+'</div><div class="name">'+p.name+'</div><div class="use">'+p.use+'</div>';
    b.onclick=()=>{current=p.text;title.innerHTML='<b>'+p.name+'</b> · '+p.code;text.textContent=p.text;panel.classList.add('show');panel.scrollIntoView({behavior:'smooth',block:'nearest'})};
    grid.appendChild(b);
  });
  document.querySelector('#copy').onclick=async()=>{await navigator.clipboard.writeText(current);document.querySelector('#copy').textContent='已复制';setTimeout(()=>document.querySelector('#copy').textContent='复制药方',1200)};
  document.querySelector('#close').onclick=()=>panel.classList.remove('show');
})().catch(err=>{document.querySelector('#grid').textContent='读取 pills.json 失败：'+err.message});
</script>
</body>
</html>
